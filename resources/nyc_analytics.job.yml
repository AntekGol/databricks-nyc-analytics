# lakeflow job orchestrating bronze -> silver -> gold on serverless compute
resources:
  jobs:
    nyc_analytics_pipeline:
      name: "[${bundle.target}] NYC Unified Analytics Pipeline"
      performance_target: STANDARD
      tags:
        aidevkit_project: ai-dev-kit
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Europe/Warsaw
        pause_status: PAUSED
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - requests==2.32.3
      tasks:
        - task_key: init_uc
          sql_task:
            file:
              path: ../src/setup/00_init_unity_catalog.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: bronze_taxi
          depends_on:
            - task_key: init_uc
          max_retries: 2
          min_retry_interval_millis: 10000
          environment_key: default
          spark_python_task:
            python_file: ../src/bronze/01_ingest_nyc_taxi.py

        - task_key: bronze_economy
          depends_on:
            - task_key: init_uc
          max_retries: 2
          min_retry_interval_millis: 10000
          environment_key: default
          spark_python_task:
            python_file: ../src/bronze/02_ingest_economy.py

        - task_key: bronze_openaq
          depends_on:
            - task_key: init_uc
          max_retries: 2
          min_retry_interval_millis: 15000
          environment_key: default
          spark_python_task:
            python_file: ../src/bronze/03_ingest_openaq.py

        - task_key: silver_taxi
          depends_on:
            - task_key: bronze_taxi
          max_retries: 2
          environment_key: default
          spark_python_task:
            python_file: ../src/silver/01_silver_taxi.py

        - task_key: silver_air_quality
          depends_on:
            - task_key: bronze_openaq
          max_retries: 2
          environment_key: default
          spark_python_task:
            python_file: ../src/silver/02_silver_air_quality.py

        - task_key: silver_economy
          depends_on:
            - task_key: bronze_economy
          max_retries: 2
          environment_key: default
          spark_python_task:
            python_file: ../src/silver/03_silver_economy.py

        - task_key: silver_watermarks
          depends_on:
            - task_key: silver_taxi
            - task_key: silver_air_quality
            - task_key: silver_economy
          max_retries: 2
          environment_key: default
          spark_python_task:
            python_file: ../src/silver/04_occ_watermarks.py

        - task_key: gold_star_schema
          depends_on:
            - task_key: silver_watermarks
          sql_task:
            file:
              path: ../src/gold/01_build_star_schema.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_governance
          depends_on:
            - task_key: gold_star_schema
          sql_task:
            file:
              path: ../src/gold/02_uc_governance.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
