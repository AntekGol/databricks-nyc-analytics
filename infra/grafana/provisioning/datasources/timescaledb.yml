apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: postgres
    isDefault: true
    editable: true
    secureJsonData:
      password: $TSDB_PASSWORD
    jsonData:
      database: weather_tsdb
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
